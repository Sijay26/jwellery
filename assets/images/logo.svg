<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4b1d8f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Subtle Glow -->
  <circle cx="60" cy="60" r="45" fill="url(#purpleGlow)" />

  <!-- Luxury Diamond Crown Icon -->
  <g transform="translate(18, 18)" filter="url(#glow)">
    <!-- Outer Diamond Shape -->
    <polygon points="42,4 78,42 42,80 6,42" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="42,12 70,42 42,72 14,42" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2,2" />
    
    <!-- Crown Facets inside -->
    <path d="M26,52 L32,32 L42,46 L52,32 L58,52 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Jewels on crown tips -->
    <circle cx="32" cy="29" r="2.5" fill="#ffffff" />
    <circle cx="42" cy="42" r="2.5" fill="#ffffff" />
    <circle cx="52" cy="29" r="2.5" fill="#ffffff" />
    <circle cx="42" cy="22" r="3" fill="url(#goldGrad)" />
    <!-- Center Brilliant Sparkle -->
    <polygon points="42,56 44,62 50,64 44,66 42,72 40,66 34,64 40,62" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(115, 0)">
    <text x="0" y="58" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">
      ROYAL AURA
    </text>
    <text x="2" y="82" font-family="'Poppins', 'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="7" fill="#e0c77a">
      HAUTE JOAILLERIE • EST. 1994
    </text>
    <!-- Elegant gold separator rule -->
    <line x1="2" y1="92" x2="260" y2="92" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
    <circle cx="131" cy="92" r="2.5" fill="url(#goldGrad)" />
  </g>
</svg>
